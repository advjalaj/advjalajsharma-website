# Keep the form-handler source and docs out of the public website.
[[redirects]]
  from = "/backend/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
